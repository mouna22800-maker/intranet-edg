# Intégration continue — Électricité de Guinée Intranet
# S'exécute automatiquement sur GitHub à chaque push / pull request.
# NOTE : ce dépôt n'est pas encore versionné avec git. Pour activer la CI :
#   git init && git add . && git commit -m "init" && git remote add origin <url> && git push -u origin main
name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Lancer les tests
        run: python -m pytest

  frontend-typecheck:
    name: Vérification des types (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npx tsc --noEmit
